name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Match the container user to the runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the pinned container
        run: docker compose build

      - name: Refuse pyproject and lock drift
        run: docker compose run --rm dev uv lock --check

      - name: Run the deterministic verification gate inside the container
        run: docker compose run --rm dev uv run --frozen python -m aebrisk.dev verify
