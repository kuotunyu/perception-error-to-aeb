name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its running check. Each push to main
# gets a group of its own, so every main commit is verified in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Match the container user to the runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the pinned container
        run: docker compose build

      - name: Refuse pyproject and lock drift
        run: docker compose run --rm dev uv lock --check

      - name: Run the deterministic verification gate inside the container
        run: docker compose run --rm dev uv run --frozen python -m aebrisk.dev verify

      # Python coverage cannot see the status script each replay embeds. A
      # fresh 151-frame contract is generated in the container and checked with
      # the runner's Node.js; both deliberate mutations must fail on a frame.
      - name: Check the replay status script against a freshly generated contract
        shell: bash
        run: |
          contract=artifacts/replay-status-contract
          docker compose run --rm dev uv run --frozen python -m pytest tests/unit/report/test_replay.py::test_replay_status_contract_fixture --no-cov -p no:cacheprovider "--basetemp=/work/$contract"
          node tests/js/check-replay-status.cjs "$contract"
          for mutation in missing-event stale; do
            if output=$(node tests/js/check-replay-status.cjs "$contract" "$mutation" 2>&1); then
              echo "::error::the $mutation mutation passed the replay status contract"
              exit 1
            fi
            if ! grep -q 'play frame' <<<"$output"; then
              printf '%s\n' "$output"
              echo "::error::the $mutation mutation failed without a frame-status assertion"
              exit 1
            fi
          done

  commit-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: New commits use the maintainer noreply identity
        shell: bash
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          maintainer='61350295+kuotunyu@users.noreply.github.com'
          # A missing, all-zero or unreachable base (first push, force-push)
          # leaves only the head commit to check.
          if [[ -z "${RANGE_BASE:-}" || "$RANGE_BASE" =~ ^0+$ ]] \
            || ! git cat-file -e "${RANGE_BASE}^{commit}" 2>/dev/null; then
            range=("$RANGE_HEAD" -1)
          else
            range=("$RANGE_BASE..$RANGE_HEAD")
          fi
          # Capture first so a failing git log fails the step instead of
          # yielding an empty, passing loop.
          commits=$(git log --format='%H%x09%an%x09%ae%x09%ce' "${range[@]}")
          bad=0
          checked=0
          while IFS=$'\t' read -r sha author_name author_email committer_email; do
            [[ -n "$sha" ]] || continue
            checked=$((checked + 1))
            if [[ "$author_email" != "$maintainer" ]]; then
              echo "::error::$sha author email $author_email is not the maintainer noreply address"
              bad=1
            fi
            if [[ "$author_name" == *"[bot]"* ]]; then
              echo "::error::$sha author $author_name is a bot account"
              bad=1
            fi
            if [[ "$committer_email" != "$maintainer" && "$committer_email" != "noreply@github.com" ]]; then
              echo "::error::$sha committer email $committer_email is neither the maintainer nor GitHub"
              bad=1
            fi
            body=$(git log -1 --format=%B "$sha")
            if grep -qiE '^[[:space:]]*co-authored-by:' <<<"$body"; then
              echo "::error::$sha message carries a co-author trailer"
              bad=1
            fi
          done <<<"$commits"
          echo "checked $checked commit(s) in ${range[*]}"
          exit "$bad"
