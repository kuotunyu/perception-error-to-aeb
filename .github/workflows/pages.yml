name: Pages

# A push to main runs CI; when that run succeeds, this workflow builds and
# deploys the same commit. A manual dispatch skips that check and deploys the
# head of the branch it runs on, so use it only to redeploy a commit CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Only the deploy job, which runs no repository code, may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Match the container user to the runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the pinned container
        run: docker compose build
      - name: Refuse pyproject and lock drift
        run: docker compose run --rm dev uv lock --check
      - name: Audit registered claims
        run: docker compose run --rm dev uv run --frozen aeb-risk audit-claims --claims docs/claims.yaml
      - name: Audit the actual bilingual release text
        run: docker compose run --rm dev uv run --frozen python .agents/skills/auditing-aeb-error-attribution/scripts/validate_attribution.py --claims docs/claims.yaml --repo-root . --document README.md --document README.en.md --document docs/release-notes/v1.0.0.md
      - name: Audit the post-hoc addendum's claims
        run: docker compose run --rm dev uv run --frozen aeb-risk audit-claims --claims docs/posthoc/nuplan_aeb_v2-addendum/claims.yaml
      - name: Audit the post-hoc addendum's results page
        run: docker compose run --rm dev uv run --frozen python .agents/skills/auditing-aeb-error-attribution/scripts/validate_attribution.py --claims docs/posthoc/nuplan_aeb_v2-addendum/claims.yaml --repo-root . --document docs/posthoc/nuplan_aeb_v2-addendum/results.md
      - name: Exercise both data-free skill contracts
        run: docker compose run --rm dev uv run --frozen python -m pytest tests/contract/skills
      - name: Audit the policy v2 study claims
        run: docker compose run --rm dev uv run --frozen aeb-risk audit-claims --claims docs/studies/aeb-policy-v2/claims.yaml
      - name: Audit the policy v2 study results page
        run: docker compose run --rm dev uv run --frozen python .agents/skills/auditing-aeb-error-attribution/scripts/validate_attribution.py --claims docs/studies/aeb-policy-v2/claims.yaml --repo-root . --document docs/studies/aeb-policy-v2/results.md
      - name: Rebuild figures from committed evidence
        run: docker compose run --rm dev uv run --frozen aeb-risk figures --evidence-dir docs/evidence/nuplan_aeb_v2 --output-dir docs/figures
      - name: Build the report with the committed replay assets
        run: docker compose run --rm dev uv run --frozen aeb-risk report --claims docs/claims.yaml --artifacts-dir docs/evidence/nuplan_aeb_v2 --output-dir site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
