<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Counted collisions against braking share</title>
<desc id="desc">One point per configuration, derived from evaluation.json: counted collisions per 1,000 scenario-replicates against the share of measured exposure spent in partial or full braking. Descriptive only; scenario-replicates are not independent, there are no intervals and no channel ranking.</desc>
