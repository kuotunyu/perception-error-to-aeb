# The nuPlan scenario-type vocabulary, observed rather than assumed.
#
# The pinned devkit ships NO canonical list of scenario types. They live in each
# log database's `scenario_tag` table, so a family mapping written from
# expectation cannot be checked against an import, and P3-04 recorded that it
# would have to be checked against the data when the order gate opened.
#
# It was, on 2026-09-06, over every database of the mini split, read-only. Five
# of the fifteen types protocol v1 pinned appear nowhere in this list:
# `crossed_by_vehicle`, `changing_lane_with_lead`, `changing_lane_with_trail`,
# `crossed_by_bike` and `near_multiple_bikes`. Protocol v2 was written from this
# file instead, and a test refuses any family type that is not in it.
#
# This is a floor, not a ceiling: a type present only in `train` or `val` would
# be absent here. The census is re-run over both at the cohort freeze and this
# file is extended if it finds one. Removing a type is a different matter and
# would mean the dataset changed under the study.

schema_version: nuplan-scenario-vocabulary/v1

provenance:
  dataset: nuplan-v1.1
  split: mini
  log_databases_read: 64
  observed_on: 2026-09-06
  method: >-
    SELECT type, COUNT(*) FROM scenario_tag GROUP BY type, over every database
    opened read-only, with no devkit ORM and no map access.

# 67 types, sorted.
